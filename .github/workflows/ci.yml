name: CI

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ci-schedule-test]
  schedule:
    # Weekly check against latest Armbian stable (vYY.MM); skips if unchanged
    - cron: "17 3 * * 1"
  push:
    branches:
      - readme
    paths:
      - .github/workflows/ci.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
      skip: ${{ steps.get.outputs.skip }}
    steps:
      - id: get
        name: Resolve sources
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$1"; }

          TIME="$(api "https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"
          if [[ -z "${TIME}" || "${TIME}" == "null" ]]; then
            TIME="$(date -u -Iseconds)"
          fi
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-UTC"
          TITLE_TIME="$(TZ=Asia/Shanghai date -d "${TIME}" +'%Y-%m-%d %H:%M CST')"
          RELEASE_NAME="OneCloud bookworm CLI · ${TITLE_TIME}"

          SCRIPT_SHA=$(api "https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF}" | jq -r .sha)
          UBOOT_TAG=$(api "https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE}" | jq -r .tag_name)

          ARMBIAN_REF=$(
            api "https://api.github.com/repos/${ARMBIAN_REPO}/git/matching-refs/heads/v" \
              | jq -r '
                  [.[] | .ref | ltrimstr("refs/heads/")
                    | select(test("^v[0-9]+\\.[0-9]+$"))]
                  | sort_by(ltrimstr("v") | split(".") | map(tonumber))
                  | last
                '
          )
          if [[ -z "${ARMBIAN_REF}" || "${ARMBIAN_REF}" == "null" ]]; then
            echo "::error::Could not resolve Armbian stable branch (vYY.MM)"
            exit 1
          fi
          ARMBIAN_SHA=$(api "https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF}" | jq -r .sha)
          FINGERPRINT="armbian=${ARMBIAN_SHA} uboot=${UBOOT_TAG}"

          echo "Resolved Armbian ${ARMBIAN_REF} @ ${ARMBIAN_SHA}"
          echo "U-Boot ${UBOOT_TAG}"
          echo "Fingerprint ${FINGERPRINT}"
          echo "Release ${RELEASE_NAME}"

          SKIP=false
          # schedule = weekly cron; repository_dispatch ci-schedule-test = manual skip probe
          if [[ "${EVENT_NAME}" == "schedule" || ( "${EVENT_NAME}" == "repository_dispatch" && "${EVENT_ACTION}" == "ci-schedule-test" ) ]]; then
            LAST_BODY=$(api "https://api.github.com/repos/${SCRIPT_REPO}/releases?per_page=5" \
              | jq -r 'map(select(.draft==false)) | .[0].body // empty')
            if [[ -n "${LAST_BODY}" ]] && grep -Fq "Fingerprint: ${FINGERPRINT}" <<<"${LAST_BODY}"; then
              echo "Schedule skip: same Armbian SHA + U-Boot tag as latest release"
              SKIP=true
            fi
          fi

          {
            echo "TIME=${TIME}"
            echo "TAG=${TAG}"
            echo "TITLE_TIME=${TITLE_TIME}"
            echo "RELEASE_NAME=${RELEASE_NAME}"
            echo "SCRIPT_SHA=${SCRIPT_SHA}"
            echo "UBOOT_TAG=${UBOOT_TAG}"
            echo "ARMBIAN_REF=${ARMBIAN_REF}"
            echo "ARMBIAN_SHA=${ARMBIAN_SHA}"
            echo "FINGERPRINT=${FINGERPRINT}"
          } >>"$GITHUB_ENV"

          {
            echo "env=$(base64 -w0 <"$GITHUB_ENV")"
            echo "skip=${SKIP}"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Sources"
            echo "- Script: \`${SCRIPT_REPO}@${SCRIPT_REF}\` (\`${SCRIPT_SHA}\`)"
            echo "- U-Boot: \`${UBOOT_REPO}@${UBOOT_TAG}\`"
            echo "- Armbian: \`${ARMBIAN_REPO}@${ARMBIAN_REF}\` (\`${ARMBIAN_SHA}\`)"
            echo "- Fingerprint: \`${FINGERPRINT}\`"
            echo "- Skip: \`${SKIP}\` (event=\`${EVENT_NAME}\`)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Create release
        if: steps.get.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## 玩客云 OneCloud · Armbian bookworm CLI

            - **构建时间**：${{ env.TITLE_TIME }}
            - **Armbian**：`${{ env.ARMBIAN_REF }}`（[`armbian/build`](https://github.com/armbian/build/tree/${{ env.ARMBIAN_REF }}) · [`${{ env.ARMBIAN_SHA }}`](https://github.com/armbian/build/tree/${{ env.ARMBIAN_SHA }})）
            - **U-Boot**：[`${{ env.UBOOT_REPO }}@${{ env.UBOOT_TAG }}`](https://github.com/${{ env.UBOOT_REPO }}/releases/tag/${{ env.UBOOT_TAG }})
            - **脚本**：[`${{ env.SCRIPT_REPO }}@${{ env.SCRIPT_REF }}`](https://github.com/${{ env.SCRIPT_REPO }}/tree/${{ env.SCRIPT_REF }})

            ### 文件说明
            - `*.burn.img.xz`：USB Burning Tool **线刷 eMMC**
            - `*.img.xz`：TF / SD 卡镜像

            默认登录：`root` / `1234`。

            Fingerprint: ${{ env.FINGERPRINT }}

            ### SHA256

  build:
    name: Image bookworm-cli
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Import env
        run: echo "${{ needs.prepare.outputs.env }}" | base64 -d >>"$GITHUB_ENV"

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Build image
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env \
            ./compile.sh build \
              ALLOW_ROOT=yes \
              BOARD=onecloud \
              BRANCH=current \
              RELEASE=bookworm \
              KERNEL_CONFIGURE=no \
              BUILD_MINIMAL=no \
              BUILD_DESKTOP=no \
              EXPERT=yes \
              SKIP_EXTERNAL_TOOLCHAINS=yes \
              CLEAN_LEVEL= \
              USE_CCACHE=no \
              COMPRESS_OUTPUTIMAGE=img
          sudo chown "$(id -u):$(id -g)" -R output/

      - name: Install burn tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y img2simg
          ver="v0.3.1"
          curl -fsSL -o ./AmlImg \
            "https://github.com/hzyitc/AmlImg/releases/download/${ver}/AmlImg_${ver}_linux_amd64"
          chmod +x ./AmlImg

      - name: Fetch U-Boot burn base
        run: |
          curl -fsSL -o ./uboot.img \
            "https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}"
          ./AmlImg unpack ./uboot.img burn/

      - name: Pack burn image
        run: |
          diskimg=$(ls output/images/*.img)
          loop=$(sudo losetup --find --show --partscan "$diskimg")
          sudo img2simg "${loop}p1" burn/boot.simg
          sudo img2simg "${loop}p2" burn/rootfs.simg
          sudo losetup -d "$loop"
          sudo chown "$(id -u):$(id -g)" -R burn/

          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" >burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" >burn/rootfs.VERIFY
          printf '%s\n' \
            'PARTITION:boot:sparse:boot.simg' \
            'VERIFY:boot:normal:boot.VERIFY' \
            'PARTITION:rootfs:sparse:rootfs.simg' \
            'VERIFY:rootfs:normal:rootfs.VERIFY' \
            >>burn/commands.txt

          prefix=$(ls output/images/*.img | sed 's/\.img$//')
          ./AmlImg pack "${prefix}.burn.img" burn/

      - name: Compress, rename, hash
        run: |
          set -euo pipefail
          rm -f output/images/*.img.txt
          for f in output/images/*.img; do
            xz --threads=0 --compress "$f"
          done

          # Example source:
          # Armbian-unofficial_26.08.0-trunk_Onecloud_bookworm_current_6.12.28.burn.img.xz
          KERNEL=""
          ARMBIAN_VER=""
          for f in output/images/*.xz; do
            bn=$(basename "$f")
            if [[ "$bn" =~ ^Armbian-unofficial_([0-9]+\.[0-9]+\.[0-9]+[^_]*)_Onecloud_bookworm_current_([0-9]+\.[0-9]+\.[0-9]+)\.(burn\.img\.xz|img\.xz)$ ]]; then
              ARMBIAN_VER="${BASH_REMATCH[1]}"
              KERNEL="${BASH_REMATCH[2]}"
              ext="${BASH_REMATCH[3]}"
              dest="output/images/Armbian_onecloud_${ARMBIAN_VER}_${KERNEL}.${ext}"
              mv "$f" "$dest"
            else
              echo "::error::Unexpected image name: ${bn}"
              exit 1
            fi
          done
          if [[ -z "${KERNEL}" || -z "${ARMBIAN_VER}" ]]; then
            echo "::error::Could not parse Armbian/kernel version from image name"
            exit 1
          fi

          : >sha256sum
          for f in output/images/*.xz; do
            sha256sum "$f" | tee -a sha256sum
          done

          {
            echo "KERNEL=${KERNEL}"
            echo "ARMBIAN_VER=${ARMBIAN_VER}"
            echo "RELEASE_NAME=OneCloud bookworm CLI · ${KERNEL} · ${TITLE_TIME}"
          } >>"$GITHUB_ENV"

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookworm-current-cli
          path: output/images/*

      - name: Append SHA256 to release
        run: |
          {
            echo
            awk '{printf "- `%s`: `%s`\n", $2, $1}' sha256sum | sed 's|output/images/||'
          } >Release.append.md

      - name: Upload images to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          append_body: true
          body_path: Release.append.md
          files: output/images/*
